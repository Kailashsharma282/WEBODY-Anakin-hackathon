version: '3.8'

services:
  # 1. PostgreSQL World Model DB
  db:
    image: postgres:15-alpine
    container_name: webody-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: webody
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis Cache & Event Broker
  redis:
    image: redis:7-alpine
    container_name: webody-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # 3. WEBODY FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webody-backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/webody
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
      ANAKIN_API_KEY: ${ANAKIN_API_KEY:-}
      ANAKIN_BASE_URL: https://api.anakin.io
    ports:
      - "8000:8000"

  # 4. WEBODY Next.js Futuristic Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webody-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
